        - heading "Контекст бізнесу" [level=2] [ref=f25e57]
        - paragraph [ref=f25e58]: "Клієнт хотів перевірити попит на продукт, новий для його цільової аудиторії в Канаді. Людині, яка раніше не стикалася з натяжними стелями, недостатньо назви послуги: потрібно побачити результат і зрозуміти, як стеля поєднується з освітленням та наявним інтер’єром."
      - generic [ref=f25e59]:
        - heading "Завдання проєкту" [level=2] [ref=f25e60]
        - paragraph [ref=f25e61]: Створити сайт, який пояснює продукт, допомагає порівняти варіанти й дає зрозумілий спосіб запросити розрахунок. До звернення відвідувачу важливо розібратися в матеріалі, оцінити вигляд і зрозуміти, що відбуватиметься вдома під час монтажу.
