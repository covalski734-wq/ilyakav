    - generic [ref=f25e75]:
      - heading "Як працює структура" [level=2] [ref=f25e76]
      - generic [ref=f25e77]:
        - article [ref=f25e78]:
          - paragraph [aria-hidden] [ref=f25e79]: "01"
          - heading "Спочатку інтер’єр, потім пояснення" [level=3] [ref=f25e80]
          - paragraph [ref=f25e81]: Велика фотографія на першому екрані показує спільний ефект стелі та світла. Наступний блок пояснює будову натяжної системи. Відвідувач пов’язує незнайомий термін зі зрозумілим результатом, а компанія отримує місце для презентації продукту до особистої консультації.
        - article [ref=f25e82]:
          - paragraph [aria-hidden] [ref=f25e83]: "02"
          - heading "Варіанти замість абстрактної обіцянки" [level=3] [ref=f25e84]
          - paragraph [ref=f25e85]: Картки глянцевих і світлопрозорих стель, світлових ліній та інших рішень дозволяють порівняти характер оздоблення. Короткі описи пов’язують вигляд із застосуванням у приміщенні. На момент звернення людині простіше назвати варіант, який її зацікавив.
        - article [ref=f25e86]:
          - paragraph [aria-hidden] [ref=f25e87]: "03"
          - heading "Роботи в реальному просторі" [level=3] [ref=f25e88]
          - paragraph [ref=f25e89]: Галерея показує стелі в житлових і комерційних інтер’єрах. Тут можна оцінити масштаб, геометрію світла та поєднання з обстановкою. Фотографія стає конкретною відправною точкою для розмови про власний проєкт.
    - generic [ref=f25e91]:
      - generic [ref=f25e92]:
        - heading "Показати те, що людина обирає" [level=2] [ref=f25e93]
        - paragraph [ref=f25e94]: "Каталог відповідає на запитання «яка стеля мені підходить», а галерея показує, як обрана ідея виглядає в кімнаті. Ці блоки доповнюють один одного: перший допомагає назвати рішення, другий дозволяє уявити його у себе."
