    - generic [ref=f25e106]:
      - article [ref=f25e107]:
        - paragraph [aria-hidden] [ref=f25e108]: "04"
        - heading "Монтаж як зрозуміла послідовність" [level=3] [ref=f25e109]
        - paragraph [ref=f25e110]: "Окреме пояснення встановлення та етапи від консультації до приймання відповідають на різні запитання: як змінюється приміщення і як організована співпраця. Така структура допомагає підготуватися до замірів та обговорення строків, а компанії заздалегідь пояснити порядок роботи."
      - article [ref=f25e111]:
        - paragraph [aria-hidden] [ref=f25e112]: "05"
        - heading "FAQ перед рішенням про звернення" [level=3] [ref=f25e113]
        - paragraph [ref=f25e114]: Запитання про вигляд, втрату висоти, догляд і строки розкривають деталі, які складно передати фотографією. Відвідувач може самостійно уточнити базові умови й перейти до розмови про свою кімнату. Конкретні властивості та умови все одно потрібно перевірити для обраної системи.
      - article [ref=f25e115]:
        - paragraph [aria-hidden] [ref=f25e116]: "06"
        - heading "Розрахунок через WhatsApp" [level=3] [ref=f25e117]
        - paragraph [ref=f25e118]: Заклики запросити розрахунок ведуть у WhatsApp; на сайті також є форма. Чат дозволяє описати приміщення та додати фотографії у звичному інтерфейсі. Для бізнесу це початок предметного діалогу про площу, освітлення й побажання, а не спроба призначити однакову ціну всім проєктам.
    - generic [ref=f25e121]:
      - generic [ref=f25e122]:
        - heading "Наступний крок із телефона" [level=2] [ref=f25e123]
        - paragraph [ref=f25e124]: На телефоні знайомство починається з того самого продукту та помітного запиту розрахунку. Відвідувач може продовжити читання або перейти до обговорення, коли інформації вже достатньо. Унизу доступні форма й посилання на WhatsApp, тому після перегляду не потрібно повертатися до початку сторінки.
