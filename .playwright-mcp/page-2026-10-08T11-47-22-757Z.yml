        - generic [ref=f3e67]:
          - paragraph [aria-hidden] [ref=f3e68]: "01"
          - heading "Кто отвечает за данные и к чему относится эта политика" [level=2] [ref=f3e69]
          - generic [ref=f3e70]:
            - paragraph [ref=f3e71]: Контролер персональных данных — Ilya Kavaleuski, независимый разработчик в Польше. Связаться по вопросам приватности можно по адресу электронной почты, указанному ниже.
            - paragraph [ref=f3e72]: Политика относится к посещению ilyakav.com, отправке контактной формы и обращениям через указанные на сайте email и Telegram. У сторонних сервисов действуют собственные правила обработки данных.
        - generic [ref=f3e73]:
          - paragraph [aria-hidden] [ref=f3e74]: "02"
          - heading "Какие данные могут обрабатываться" [level=2] [ref=f3e75]
          - generic [ref=f3e76]:
            - paragraph [ref=f3e77]: При отправке контактной формы имя, контактные данные, выбранный тип проекта и описание задачи передаются серверу сайта на Cloudflare, а затем в мой Telegram через бота. Код сайта не записывает поля формы в отдельную базу данных. Если отправка не удалась, можно обратиться напрямую или открыть черновик письма в почте.
            - paragraph [ref=f3e78]: При обращении напрямую могут обрабатываться указанные вами контактные данные, содержание сообщения и дальнейшая переписка через выбранный канал — email или Telegram.
            - paragraph [ref=f3e79]: Браузер локально сохраняет только выбранные язык и тему. Хостинг и сетевые сервисы могут автоматически обрабатывать технические журналы, например IP-адрес, тип браузера, время и запрошенный адрес, для доставки, стабильности и защиты сайта.
        - generic [ref=f3e80]:
          - paragraph [aria-hidden] [ref=f3e81]: "03"
          - heading "Для чего и на каком основании используются данные" [level=2] [ref=f3e82]
          - generic [ref=f3e83]:
            - paragraph [ref=f3e84]: Данные из обращения используются, чтобы ответить, обсудить задачу и выполнить действия до заключения договора или сам договор. Основанием может быть статья 6(1)(b) GDPR. Технические данные могут обрабатываться для надёжной и безопасной работы сайта на основании законного интереса по статье 6(1)(f).
            - paragraph [ref=f3e85]: Если обработка необходима для выполнения юридической обязанности, применяется статья 6(1)(c) GDPR. На сайте нет собственной аналитики, рекламного профилирования и автоматизированного принятия решений.
        - generic [ref=f3e86]:
          - paragraph [aria-hidden] [ref=f3e87]: "04"
          - heading "Сторонние сервисы и передача данных" [level=2] [ref=f3e88]
          - generic [ref=f3e89]:
            - paragraph [ref=f3e90]: Персональные данные не продаются. В необходимом объёме их могут обрабатывать поставщики хостинга и сетевой инфраструктуры, а также выбранные вами сервисы связи — почта или Telegram — в соответствии со своими условиями.
            - paragraph [ref=f3e91]: На странице кейса marianaleus.com живое iframe-превью подключается только на компьютере и только после явного нажатия кнопки Live. После этого marianaleus.com и его поставщики могут получить обычные данные сетевого запроса и применять собственные правила приватности.
        - generic [ref=f3e92]:
          - paragraph [aria-hidden] [ref=f3e93]: "05"
          - heading "Cookies, локальное хранение и внешние ресурсы" [level=2] [ref=f3e94]
          - generic [ref=f3e95]:
            - paragraph [ref=f3e96]:
              - text: ilyakav-consent хранит выбор категорий, версию согласия и дату в localStorage. Сайт принимает этот выбор 180 дней, затем спрашивает снова; само localStorage не имеет автоматического срока удаления. ilyakav-lang и ilyakav-theme сохраняют язык и тему до очистки данных сайта. Эти записи управляются сайтом и не являются рекламными идентификаторами.
              - link "Политика cookies" [ref=f3e97] [cursor=pointer]:
                - /url: /cookies
              - text: ·
              - button "Настройки cookies" [ref=f3e98] [cursor=pointer]
            - paragraph [ref=f3e99]: Необязательная аналитика и маркетинг разрешены только после вашего согласия. Выбор, его дата и версия сохраняются в localStorage; настройки доступны в футере. Подробный список используемых хранилищ и текущий статус сервисов приведены в Политике cookies.
            - paragraph [ref=f3e100]: Шрифты Google Fonts загружаются с серверов Google, поэтому Google получает технические данные запроса. Стороннее iframe-превью может использовать собственные технологии хранения только после его явного запуска на компьютере.
        - generic [ref=f3e101]:
          - paragraph [aria-hidden] [ref=f3e102]: "06"
          - heading "Срок хранения" [level=2] [ref=f3e103]
          - generic [ref=f3e104]:
            - paragraph [ref=f3e105]: Отправленные через форму сообщения поступают в Telegram. Сообщения и связанная с проектом переписка хранятся столько, сколько необходимо для ответа, сотрудничества, защиты возможных требований и выполнения применимых обязанностей.
            - paragraph [ref=f3e106]: Сроки хранения технических журналов определяют соответствующие поставщики с учётом безопасности и юридических требований. Данные удаляются или обезличиваются, когда больше не нужны, если закон не требует сохранить их дольше.
        - generic [ref=f3e107]:
          - paragraph [aria-hidden] [ref=f3e108]: "07"
          - heading "Ваши права" [level=2] [ref=f3e109]
          - generic [ref=f3e110]:
            - paragraph [ref=f3e111]: В предусмотренных GDPR случаях вы можете запросить доступ к данным, их исправление или удаление, ограничение обработки, переносимость, а также возразить против обработки. Если основанием служит согласие, его можно отозвать на будущее.
            - paragraph [ref=f3e112]: Чтобы воспользоваться правами, напишите по адресу ниже. Также можно подать жалобу в польский надзорный орган UODO на сайте uodo.gov.pl.
        - generic [ref=f3e113]:
          - paragraph [aria-hidden] [ref=f3e114]: "08"
          - heading "Безопасность" [level=2] [ref=f3e115]
          - generic [ref=f3e116]:
            - paragraph [ref=f3e117]: Применяются разумные технические и организационные меры, соответствующие характеру сайта и обрабатываемых данных, включая ограничение объёма данных и использование поставщиков, необходимых для работы сервиса.
            - paragraph [ref=f3e118]: Ни один способ передачи или хранения данных не обеспечивает абсолютной безопасности. При обращении не отправляйте чувствительную информацию, которая не нужна для обсуждения проекта.
        - generic [ref=f3e119]:
          - paragraph [aria-hidden] [ref=f3e120]: "09"
          - heading "Передача данных за пределы ЕЭЗ" [level=2] [ref=f3e121]
          - generic [ref=f3e122]:
            - paragraph [ref=f3e123]: Некоторые выбранные поставщики, включая Google или сервисы связи, могут обрабатывать данные за пределами Европейской экономической зоны.
            - paragraph [ref=f3e124]: Когда это требуется, такие передачи должны опираться на применимый механизм защиты, например решение об адекватности или стандартные договорные положения. Конкретные условия зависят от поставщика, которым вы пользуетесь.
        - generic [ref=f3e125]:
          - paragraph [aria-hidden] [ref=f3e126]: "10"
          - heading "Изменения политики" [level=2] [ref=f3e127]
          - generic [ref=f3e128]:
            - paragraph [ref=f3e129]: Политика может обновляться, если меняются сайт, используемые сервисы или юридические требования. Актуальная версия публикуется на этой странице.
            - paragraph [ref=f3e130]: Дата последнего обновления указана в начале документа. Существенные изменения применяются с момента публикации, если иной срок не требуется законом.
