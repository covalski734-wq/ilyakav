    - article [ref=f4e23]:
      - generic [ref=f4e24]:
        - heading "Политика cookies" [level=1] [ref=f4e25]
        - paragraph [ref=f4e26]: Политика описывает cookies и аналогичное хранение данных в браузере на этом сайте. Обновлено 8 октября 2026 года.
        - button "Настройки cookies" [ref=f4e27] [cursor=pointer]
        - generic [ref=f4e28]:
          - heading "Что хранится в браузере" [level=2] [ref=f4e29]
          - paragraph [ref=f4e30]: ilyakav-consent хранит выбор категорий, версию согласия и дату в localStorage. Сайт принимает этот выбор 180 дней, затем спрашивает снова; само localStorage не имеет автоматического срока удаления. ilyakav-lang и ilyakav-theme сохраняют язык и тему до очистки данных сайта. Эти записи управляются сайтом и не являются рекламными идентификаторами.
        - generic [ref=f4e31]:
          - heading "Необходимые" [level=2] [ref=f4e32]
          - paragraph [ref=f4e33]: Сохраняют выбор согласия, язык и тему. Нужны для работы этих функций.
          - heading "Аналитика" [level=2] [ref=f4e34]
          - paragraph [ref=f4e35]: Просмотры страниц, нажатия на кнопки связи и успешная отправка формы. Содержимое формы не передаётся.
          - heading "Маркетинг" [level=2] [ref=f4e36]
          - paragraph [ref=f4e37]: Измерение и персонализация рекламы, включая хранение и использование рекламных данных. Рекламные сервисы сейчас не подключены.
        - generic [ref=f4e38]:
          - heading "Необязательные сервисы" [level=2] [ref=f4e39]
          - paragraph [ref=f4e40]: В проверенном проекте нет идентификаторов Google Analytics, Google Ads или Meta Pixel. По умолчанию необязательные сервисы не подключены. Интеграция поддерживает Google Tag Manager, но перед публикацией контейнера нужно проверить его поставщиков, cookies и сроки хранения. Эти сведения требуют подтверждения и не представлены здесь как действующие cookies.
        - generic [ref=f4e41]:
          - heading "Другие внешние запросы" [level=2] [ref=f4e42]
          - paragraph [ref=f4e43]: Сайт размещён на Cloudflare и загружает Google Fonts. При этих запросах могут передаваться технические данные, например IP-адрес и сведения о браузере; отказ от аналитики не отключает хостинг и шрифты. В кейсе Mariana Leus по действию посетителя может загружаться демонстрация marianaleus.com. Внешний сайт самостоятельно управляет своим хранением данных. Его поставщиков и хранилища необходимо проверить отдельно.
        - generic [ref=f4e44]:
          - heading "Изменение и отзыв согласия" [level=2] [ref=f4e45]
          - paragraph [ref=f4e46]: "Откройте «Настройки cookies» в футере. «Отклонить все» оставляет только необходимое хранение. Отзыв прекращает новые необязательные события и удаляет распознаваемые доступные cookies аналитики и рекламы этого домена, если они есть. Если скрипты уже загружены, страница обновляется для остановки их таймеров. Это не удаляет ранее переданные данные и cookies других доменов: используйте настройки данных сайтов в браузере и обращайтесь к соответствующему поставщику для удаления данных."
          - button "Настройки cookies" [ref=f4e47] [cursor=pointer]
        - generic [ref=f4e48]:
          - heading "Сведения для подтверждения" [level=2] [ref=f4e49]
          - paragraph [ref=f4e50]: Перед подключением поставщика нужно подтвердить юридическое имя и адрес оператора, поставщиков и точный список cookies, сроки хранения, цели, международную передачу и правовые основания. Существенные изменения требуют новой версии согласия. Техническая реализация не является юридическим заключением.
