            - listitem [ref=f26e78]: Get an explanation of how the project works and how to update it.
            - listitem [ref=f26e79]: Return to us for future changes at a client discount.
          - paragraph [ref=f26e80]: You choose who maintains the website. There is no compulsory subscription to our support.
        - article [ref=f26e81]:
