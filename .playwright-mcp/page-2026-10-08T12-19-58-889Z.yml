        - heading "Before you decide" [level=2] [ref=f26e65]
        - paragraph [ref=f26e66]: A website helps you respond to interest in your business, but does not create visitor traffic on its own. Traffic sources are discussed separately. For a single offer, a landing page may be enough.
    - generic [ref=f26e68]:
