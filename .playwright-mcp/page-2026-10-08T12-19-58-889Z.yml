        - heading "The problem it solves" [level=2] [ref=f26e38]
        - paragraph [ref=f26e39]: A recommendation or an ad can introduce someone to your business, but they still need to decide. A website gives them space to compare services, check terms, see examples and send a request. You spend less time repeating the basics in every conversation.
        - heading "When it makes sense" [level=3] [ref=f26e40]
        - paragraph [ref=f26e41]: You offer several services, customers ask similar questions, and their decision depends on examples, pricing or an explanation of the process.
